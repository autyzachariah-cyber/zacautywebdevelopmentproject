<!DOCTYPE html>

<head>
    <title>Help/Support</title>
    <script src="../javascript/support_script.js"></script>
    <link rel="stylesheet" href="../CSS/styling.css"/>
    <link rel="stylesheet" href="../CSS/mobile_view.css" media="screen and (max-width:480px)"/>
    <!--https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    

    <h1>Help/Support</h1>
    <nav>
        <ul><a href="../HTML/Dashboard.html">Dashboard</a></ul>
        <ul><a href="../HTML/student_details.html">Student Details</a></ul>

        <ul><a href="../HTML/help_support.html">Help/Support</a></ul>
    </nav>

<body>
<form id="testform" action="">
    <fieldset>
    <label for="name">Enter your Name</label>
    <input type="text" id="name" name="name" placeholder="name contain alphabet only">
    <br/>
    <label for="gender">Gender</label>
    <input type="radio" id="gender" name="name">Female</input>
    <input type="radio" id="gender" name="name">Male</input>
    </fieldset>
    <fieldset>
        <label for="state">State:</label>
        <select id="state" name="state">
            <option value=""></option>
            <option value="VIC">VIC</option>
            <option value="NSW">NSW</option>
            <option value="QLD">QLD</option>
            <option value="WA">WA</option>
            <option value="NT">NT</option>
            <option value="TAS">TAS</option>
            <option value="SA">SA</option>
            </select>
    </fieldset>
    <br/>
    <fieldset>
        <legend>What is the nature of the support you need? Check any that apply:</legend>
        <input type="checkbox" id="support" name="personal" value="personal">
        <label for="personal">Personal</label>
        <input type="checkbox" id="support" name="financial" value="financial">
        <label for="financial">Financial</label>
        <input type="checkbox" id="support" name="educational" value="educational">
        <label for="educational">Educational</label>
        <input type="checkbox" id="support" name="enrolment" value="enrolment">
        <label for="enrolment">Enrolment</label>
    </fieldset>

    <p>
        <input type="submit" value="submit">
    </p>
</form>
</body>
